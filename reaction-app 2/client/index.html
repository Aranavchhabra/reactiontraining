<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reaction Duel</title>
<script src="https://unpkg.com/colyseus.js@0.16.22/dist/colyseus.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Arial, sans-serif; max-width: 560px; margin: 24px auto; text-align: center; padding: 0 16px; }
  #stage { height: 240px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
           font-size: 30px; font-weight: 700; color: white; background: #555; transition: background 0.1s; user-select: none; }
  .wait { background: #c0392b; }
  .go   { background: #27ae60; }
  .idle { background: #7f8c8d; }
  button { font-size: 16px; padding: 10px 18px; margin: 6px; border-radius: 8px; border: none; cursor: pointer; }
  .primary { background: #2980b9; color: white; }
  .accent  { background: #f39c12; color: white; }
  .purple  { background: #8e44ad; color: white; }
  input { padding: 8px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }
  #roomCodeBox { font-size: 15px; margin: 10px 0; padding: 10px; background: #eef6ff; border-radius: 8px; }
  #roomCodeBox b { font-size: 20px; letter-spacing: 1px; }
  #players { font-size: 14px; margin: 10px 0; text-align: left; background: #fafafa; padding: 10px; border-radius: 8px; }
  #leaderboard { text-align: left; margin: 14px 0; }
  #leaderboard ol { padding-left: 22px; }
  #log { text-align: left; font-family: monospace; font-size: 11px; background: #f4f4f4; padding: 8px;
         border-radius: 8px; height: 100px; overflow-y: auto; margin-top: 14px; }
  #lobby { display: block; }
  #game { display: none; }
</style>
</head>
<body>
  <h2>⚡ Reaction Duel</h2>

  <div id="lobby">
    <p>Name: <input id="nameInput" value="Player" /></p>
    <button id="createBtn" class="primary">Create Room</button>
    <p>— or —</p>
    <input id="codeInput" placeholder="Room code" style="text-transform:uppercase" />
    <button id="joinBtn" class="accent">Join Room</button>
  </div>

  <div id="game">
    <div id="roomCodeBox">Room code: <b id="roomCodeDisplay"></b><br/><small>Share this code with your friends</small></div>
    <div id="players"></div>
    <div id="stage" class="idle">Not started</div>
    <div>
      <button id="readyBtn" class="accent" style="display:none;">Ready</button>
      <button id="startBtn" class="primary" style="display:none;">Start Match</button>
      <button id="rematchBtn" class="purple" style="display:none;">Play Again</button>
    </div>
    <div id="hostHint" style="font-size:13px;color:#666;"></div>
    <div id="leaderboard"></div>
  </div>

  <div id="log"></div>

<script>
  const stage = document.getElementById("stage");
  const logEl = document.getElementById("log");
  const readyBtn = document.getElementById("readyBtn");
  const startBtn = document.getElementById("startBtn");
  const hostHint = document.getElementById("hostHint");
  const rematchBtn = document.getElementById("rematchBtn");
  const createBtn = document.getElementById("createBtn");
  const joinBtn = document.getElementById("joinBtn");
  const playersEl = document.getElementById("players");
  const leaderboardEl = document.getElementById("leaderboard");
  const lobbyEl = document.getElementById("lobby");
  const gameEl = document.getElementById("game");
  const roomCodeDisplay = document.getElementById("roomCodeDisplay");

  function log(msg) {
    const line = document.createElement("div");
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logEl.prepend(line);
  }

  let room = null;
  let phase = "idle";
  let receiveTime = null; // local timestamp when this client received "go"
  let mySessionId = null;

  const client = new Colyseus.Client(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`);

  function enterGame() {
    lobbyEl.style.display = "none";
    gameEl.style.display = "block";
    roomCodeDisplay.textContent = room.roomId;
    mySessionId = room.sessionId;
    readyBtn.style.display = "inline-block";

    room.onMessage("state", (state) => {
      renderPlayers(state);
      phase = state.phase;
      const isHost = state.hostId === mySessionId;
      const connected = Object.entries(state.players).filter(([, p]) => p.connected);
      const allReady = connected.length >= 2 && connected.every(([, p]) => p.ready);

      if (state.phase === "armed") setStage("wait", "Wait...");

      if (state.phase === "waiting") {
        rematchBtn.style.display = "none";
        leaderboardEl.innerHTML = "";
        setStage("idle", "Press Ready");

        readyBtn.style.display = "inline-block";
        readyBtn.disabled = false;

        if (isHost) {
          startBtn.style.display = "inline-block";
          startBtn.disabled = !allReady;
          hostHint.textContent = allReady
            ? "Everyone's ready — hit Start Match!"
            : "Waiting for everyone to hit Ready before you can start...";
        } else {
          startBtn.style.display = "none";
          hostHint.textContent = allReady
            ? "Waiting for the host to start the match..."
            : "Waiting for everyone to hit Ready...";
        }
      } else {
        startBtn.style.display = "none";
        hostHint.textContent = "";
      }
    });

    room.onMessage("go", (msg) => {
      receiveTime = performance.now();
      setStage("go", "TAP!");
      log(`GO received (server time ${msg.serverTime})`);
    });

    room.onMessage("result", (payload) => {
      renderLeaderboard(payload.leaderboard);
      setStage("idle", "Round over — see results below");
      rematchBtn.style.display = "inline-block";
      readyBtn.style.display = "none";
      log(`RESULT: ${JSON.stringify(payload.leaderboard)}`);
    });

    stage.onclick = () => handleTap();
  }

  createBtn.onclick = async () => {
    const name = document.getElementById("nameInput").value || "Player";
    try {
      room = await client.create("reaction_duel", { name });
      log(`Created room ${room.roomId} as ${name}`);
      enterGame();
    } catch (e) {
      log(`Create failed: ${e.message}`);
    }
  };

  joinBtn.onclick = async () => {
    const name = document.getElementById("nameInput").value || "Player";
    const code = document.getElementById("codeInput").value.trim();
    if (!code) { log("Enter a room code first"); return; }
    try {
      room = await client.joinById(code, { name });
      log(`Joined room ${room.roomId} as ${name}`);
      enterGame();
    } catch (e) {
      log(`Join failed: ${e.message}`);
    }
  };

  readyBtn.onclick = () => {
    room.send("ready");
    readyBtn.disabled = true;
    log("Marked ready");
  };

  startBtn.onclick = () => {
    room.send("start");
    log("Host started the match");
  };

  rematchBtn.onclick = () => {
    room.send("rematch");
  };

  function handleTap() {
    if (!room) return;
    const tapTime = performance.now();
    if (phase === "armed") {
      room.send("tap", { reactionTimeMs: -1 });
      log("FALSE START (tapped before go)");
      return;
    }
    if (phase !== "live" || receiveTime === null) return;
    const reactionTimeMs = tapTime - receiveTime;
    room.send("tap", { reactionTimeMs });
    log(`Tapped! reaction = ${reactionTimeMs.toFixed(1)}ms`);
    receiveTime = null;
  }

  function setStage(cls, text) {
    stage.className = cls;
    stage.textContent = text;
  }

  function renderPlayers(state) {
    const rows = [];
    for (const [id, p] of Object.entries(state.players)) {
      if (!p.connected) continue;
      rows.push(`${p.name}${id === mySessionId ? " (you)" : ""} — ${p.ready ? "✅ ready" : "…waiting"}`);
    }
    playersEl.innerHTML = `<b>Players (${rows.length})</b><br/>` + rows.join("<br/>");
  }

  function renderLeaderboard(leaderboard) {
    const medals = ["🥇", "🥈", "🥉"];
    const items = leaderboard.map((p, i) => {
      const medal = medals[i] || `${i + 1}.`;
      const you = p.id === mySessionId ? " (you)" : "";
      let label;
      if (p.falseStart) label = "false start ❌";
      else if (p.didNotTap) label = "did not tap";
      else label = `${p.reactionTimeMs.toFixed(1)}ms`;
      return `<li>${medal} ${p.name}${you} — ${label}</li>`;
    });
    leaderboardEl.innerHTML = `<b>Results (Round)</b><ol>${items.join("")}</ol>`;
  }

  // Allow spacebar tap too
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); handleTap(); }
  });
</script>
</body>
</html>
